<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextFloor – Vorschau</title>
    <style>
      /* Like HA: the panel's parent has no explicit height, the panel sizes itself. */
      body {
        margin: 0;
        background: var(--primary-background-color, #111111);
        color: var(--primary-text-color, #e1e1e1);
      }
    </style>
  </head>
  <body>
    <nextfloor-panel></nextfloor-panel>
    <script type="module">
      // Mock of the Home Assistant frontend object with invented demo data.
      import { DEMO_AREAS, DEMO_BUILDING, DEMO_FLOORS, DEMO_PACK, DEMO_ENTITIES, DEMO_STATES, DEMO_PICTURES } from "./demo-data.js";

      const params = new URLSearchParams(location.search);
      // Home Assistant's default themes, so the preview shows how NextFloor follows them (?ha=light, dark otherwise)
      const light = params.get("ha") === "light";
      const haTheme = light
        ? { "--primary-color": "#03a9f4", "--text-primary-color": "#ffffff", "--primary-text-color": "#212121", "--secondary-text-color": "#727272", "--card-background-color": "#ffffff", "--primary-background-color": "#fafafa", "--secondary-background-color": "#e5e5e5", "--divider-color": "rgba(0, 0, 0, 0.12)", "--ha-card-border-radius": "12px", "--state-light-active-color": "#ffc107", "--error-color": "#db4437", "--success-color": "#43a047", "--info-color": "#039be5", "--primary-font-family": "Roboto, 'Noto Sans', sans-serif" }
        : { "--primary-color": "#03a9f4", "--text-primary-color": "#ffffff", "--primary-text-color": "#e1e1e1", "--secondary-text-color": "#9b9b9b", "--card-background-color": "#1c1c1c", "--primary-background-color": "#111111", "--secondary-background-color": "#1a1a1a", "--divider-color": "rgba(225, 225, 225, 0.12)", "--ha-card-border-radius": "12px", "--state-light-active-color": "#ffc107", "--error-color": "#db4437", "--success-color": "#43a047", "--info-color": "#039be5", "--primary-font-family": "Roboto, 'Noto Sans', sans-serif" };
      for (const [k, v] of Object.entries(haTheme)) document.documentElement.style.setProperty(k, v);
      document.documentElement.style.colorScheme = light ? "light" : "dark";
      // the power flow lines are on with ?flows (and off without, whatever an earlier page stored)
      try {
        localStorage.setItem("nextfloor.flows", params.has("flows") ? "1" : "0");
      } catch {}
      let building = params.has("empty") ? { version: 1, floors: [], settings: { wall_exterior: 0.24, wall_interior: 0.12, grid: 0.05 } } : DEMO_BUILDING;
      if (params.has("cars")) {
        // development view: the vehicles of the vehicles pack side by side on a plain floor (?cars)
        const pack = await (await fetch("../custom_components/nextfloor/packs/nextfloor.fahrzeuge.json")).json();
        const eg = structuredClone(DEMO_BUILDING.floors[0]);
        const items = pack.items.filter((i) => i.id.startsWith(params.get("cars") || "tesla"));
        const gap = 3.4;
        eg.rooms = [{ ...eg.rooms[0], id: "room_cars", name: "Garage", area_id: null, points: [[0, 0], [items.length * gap + 0.6, 0], [items.length * gap + 0.6, 7], [0, 7]] }];
        eg.openings = [];
        eg.placements = [];
        eg.outdoor = [];
        eg.walls = [];
        eg.furniture = items.map((it, i) => ({ id: `car${i}`, type: `pack:${pack.id}:${it.id}`, x: 1.9 + i * gap, z: 3.5, w: it.size[0], d: it.size[1], h: it.size[2], rotation: 0, variant: null }));
        building = { ...DEMO_BUILDING, floors: [eg], settings: { ...DEMO_BUILDING.settings, roof: { type: "none" } } };
      }
      let revision = 1;
      const images = { ...DEMO_PICTURES };
      const listeners = new Set();
      // invented restore points
      const history = [{ id: "s0", revision: 0, saved_at: Date.now() / 1000 - 3600, building: structuredClone(building) }];

      // furniture packs: the invented demo pack and the packs that come with NextFloor
      const BUILTIN = ["bad", "energie", "fahrzeuge", "fitness", "garten", "kino", "kueche", "schlafen", "technik", "wohnen"];
      let importedPacks = null;
      // one shared load: parallel callers must not see the list half filled
      let packsLoad = null;
      function previewPacks() {
        packsLoad ??= (async () => {
          const list = [DEMO_PACK];
          for (const name of BUILTIN) {
            try {
              const res = await fetch(`../custom_components/nextfloor/packs/nextfloor.${name}.json`);
              if (res.ok) list.push({ builtin: true, ...(await res.json()) });
            } catch {
              // served without the packs: the demo pack alone
            }
          }
          importedPacks = list;
          return list;
        })();
        return packsLoad.then(() => importedPacks);
      }

      const hass = {
        language: params.get("lang") || "de",
        themes: { darkMode: !light },
        user: { is_admin: !params.has("user"), name: "Demo" },
        areas: DEMO_AREAS,
        floors: DEMO_FLOORS,
        entities: DEMO_ENTITIES,
        devices: {},
        states: structuredClone(DEMO_STATES),
        connection: {
          async subscribeMessage(cb) {
            listeners.add(cb);
            return async () => listeners.delete(cb);
          },
        },
        async callService(domain, service, data) {
          // enough behaviour to see the effect of the room panel and of taps in 3D
          const states = { ...current.states };
          for (const id of [].concat(data?.entity_id ?? [])) {
            const st = states[id];
            if (!st) continue;
            const next = { ...st, attributes: { ...st.attributes } };
            const a = next.attributes;
            const setOn = (on) => {
              next.state = on ? "on" : "off";
              if (domain === "light" && on && a.brightness === undefined) a.brightness = 200;
              if (domain === "light" && !on) delete a.brightness;
            };
            if (service === "toggle") setOn(st.state !== "on");
            else if (service === "turn_off") setOn(false);
            else if (service === "turn_on" && domain === "light") {
              setOn(true);
              if (data.brightness_pct !== undefined) a.brightness = Math.round((data.brightness_pct / 100) * 255);
              if (data.color_temp_kelvin !== undefined) Object.assign(a, { color_temp_kelvin: data.color_temp_kelvin, color_mode: "color_temp" });
              if (data.rgb_color) Object.assign(a, { rgb_color: data.rgb_color, color_mode: "hs" });
            } else if (service === "open_cover") {
              next.state = "open";
              a.current_position = 100;
            } else if (service === "close_cover") {
              next.state = "closed";
              a.current_position = 0;
            } else if (service === "set_cover_position") {
              a.current_position = data.position;
              next.state = data.position > 0 ? "open" : "closed";
            } else if (service === "set_temperature") a.temperature = data.temperature;
            else if (service === "set_hvac_mode") next.state = data.hvac_mode;
            else if (service === "media_play_pause") next.state = st.state === "playing" ? "paused" : "playing";
            else if (service === "volume_set") a.volume_level = data.volume_level;
            states[id] = next;
          }
          current = { ...current, states };
          if (window.nfCard) window.nfCard.hass = current;
          else if (window.nfPanel) window.nfPanel.hass = current;
        },
        async callWS(msg) {
          switch (msg.type) {
            case "nextfloor/building/get": {
              // the online demo has no private packs: their items would stand as grey boxes, so leave them out
              const packs = await previewPacks();
              const known = new Set(packs.flatMap((p) => p.items.map((it) => `pack:${p.id}:${it.id}`)));
              const shown = structuredClone(building);
              for (const f of shown.floors) f.furniture = f.furniture.filter((m) => !m.type.startsWith("pack:") || known.has(m.type));
              return { building: shown, revision };
            }
            case "nextfloor/building/save":
              // ?savefail simulates a backend that still runs an older version
              if (params.has("savefail")) throw { code: "invalid_format", message: "extra keys not allowed @ data['building']['floors'][0]['furniture'][0]['entity']" };
              building = structuredClone(msg.building);
              revision += 1;
              for (const cb of listeners) cb({ revision });
              return { revision };
            case "nextfloor/history/list":
              return { snapshots: history.map(({ building: b, ...rest }) => ({ ...rest, floors: b.floors.length, rooms: b.floors.reduce((n, f) => n + f.rooms.length, 0), furniture: b.floors.reduce((n, f) => n + f.furniture.length, 0) })).reverse() };
            case "nextfloor/history/snapshot":
              history.push({ id: `s${history.length + 1}`, revision, saved_at: Date.now() / 1000, building: structuredClone(building) });
              return null;
            case "nextfloor/history/restore": {
              const snap = history.find((h) => h.id === msg.snapshot_id);
              building = structuredClone(snap.building);
              revision += 1;
              for (const cb of listeners) cb({ revision });
              return { revision };
            }
            case "nextfloor/image/get":
              if (!images[msg.image_id]) throw { code: "not_found", message: "Image not found" };
              return { data: images[msg.image_id] };
            case "nextfloor/image/set":
              images[msg.image_id] = msg.data;
              return null;
            case "nextfloor/packs/list":
              return { packs: await previewPacks() };
            case "nextfloor/packs/import": {
              // plain JSON (or a wrapped {"payload": …} file), like the integration
              let data = JSON.parse(msg.pack);
              if (data.payload) data = data.payload;
              if (data.format !== "nfpack") throw { code: "not_a_pack", message: "not a pack" };
              importedPacks = [...importedPacks.filter((p) => p.id !== data.id), data];
              return { id: data.id, name: data.name, publisher: data.publisher, licensee: null, items: data.items.length };
            }
            case "nextfloor/packs/remove":
              importedPacks = importedPacks.filter((p) => p.id !== msg.pack_id);
              return null;
            case "recorder/statistics_during_period": {
              // today's solar curve: a sunny day, five-minute means from midnight up to now
              const midnight = new Date();
              midnight.setHours(0, 0, 0, 0);
              const slots = Math.floor((Date.now() - midnight.getTime()) / 300000) + 1;
              const peak = Number(hass.states["sensor.pv_leistung"]?.state) > 2000 ? 7100 : 3400;
              const curve = Array.from({ length: slots }, (_, i) => {
                const h = (i * 5) / 60;
                const sun = Math.max(0, Math.sin((Math.PI * (h - 6.2)) / 13.2));
                return { start: midnight.getTime() + i * 300000, end: midnight.getTime() + (i + 1) * 300000, mean: Math.round(peak * Math.pow(sun, 1.6) * (0.9 + 0.1 * Math.sin(i * 0.7))) };
              });
              return Object.fromEntries((msg.statistic_ids ?? []).map((id) => [id, curve]));
            }
            case "history/history_during_period": {
              // invented motion of the last half hour: hall, kitchen, then the living-room camera
              const now = Date.now() / 1000;
              const on = (entity, ...minutesAgo) => [entity, minutesAgo.flatMap((m) => [{ s: "on", lu: now - m * 60 }, { s: "off", lu: now - m * 60 + 40 }])];
              return Object.fromEntries([
                on("binary_sensor.flur_bewegung", 26, 12),
                on("binary_sensor.kueche_praesenz", 22, 9),
                on("binary_sensor.wohnzimmer_kamera_bewegung", 17, 3),
                on("binary_sensor.garage_auto", 28),
              ]);
            }
            default:
              throw { code: "unknown_command", message: msg.type };
          }
        },
      };

      if (params.has("pv")) {
        // ?pv=5400 sets the solar power (W) of the demo plant, e.g. a sunny noon
        hass.states["sensor.pv_leistung"] = { ...hass.states["sensor.pv_leistung"], state: params.get("pv") };
      }
      if (params.has("weather")) {
        // ?weather=pouring|snowy|fog|lightning-rainy|cloudy… sets the demo weather
        hass.states["weather.zuhause"].state = params.get("weather");
        hass.states["weather.zuhause"].attributes = { ...hass.states["weather.zuhause"].attributes, cloud_coverage: 85, wind_speed: 25, wind_speed_unit: "km/h" };
      }
      if (params.has("alerts")) {
        // ?alerts: smoke in the kitchen while it rains on open windows
        hass.states["binary_sensor.kueche_rauch"].state = "on";
        hass.states["weather.zuhause"].state = "rainy";
      }
      let current = hass;
      await import("../custom_components/nextfloor/frontend/nextfloor.js");
      if (params.has("site")) {
        // ?site: the public online demo says what it is and where to get NextFloor
        const de = hass.language === "de";
        // phones: short and at the top of the 3D area, clear of the toolbars at the bottom
        const narrow = innerWidth < 700;
        const bar = document.createElement("div");
        bar.style.cssText =
          (narrow ? "position:fixed;left:50%;top:244px;" : "position:fixed;left:50%;bottom:64px;") +
          "transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:nowrap;white-space:nowrap;justify-content:center;max-width:calc(100vw - 32px);padding:8px 14px;border-radius:999px;background:rgba(7,11,20,.88);border:1px solid rgba(0,229,255,.45);color:#cfe9ff;font:13px/1.3 Figtree,Roboto,sans-serif;box-shadow:0 0 18px rgba(0,229,255,.25)";
        const link = (href, text) => `<a href="${href}" target="_blank" rel="noopener" style="color:#00e5ff;font-weight:600;text-decoration:none">${text}</a>`;
        // the install button stands out; GitHub, the manual and the language as plain links
        const install = (text) =>
          `<a href="https://github.com/therealMRBK/NextFloor#installation" target="_blank" rel="noopener" style="background:#00e5ff;color:#06101c;font-weight:700;text-decoration:none;padding:5px 12px;border-radius:999px">${text}</a>`;
        const github = link("https://github.com/therealMRBK/NextFloor", "★ GitHub");
        bar.innerHTML = de
          ? `<span>${narrow ? "Demo" : "Demo mit erfundenen Daten – probier alles aus"}</span>${install(narrow ? "Installieren" : "Jetzt installieren")}${github}${narrow ? "" : link("https://github.com/therealMRBK/NextFloor/blob/main/docs/anleitung.md", "Anleitung")}${link("?site&lang=en", narrow ? "EN" : "English")}`
          : `<span>${narrow ? "Demo" : "Demo with invented data – try everything"}</span>${install(narrow ? "Install" : "Install now")}${github}${narrow ? "" : link("https://github.com/therealMRBK/NextFloor/blob/main/docs/manual.md", "Manual")}${link("?site&lang=de", narrow ? "DE" : "Deutsch")}`;
        const close = document.createElement("button");
        close.textContent = "×";
        close.setAttribute("aria-label", de ? "Schließen" : "Close");
        close.style.cssText = "background:none;border:0;color:#cfe9ff;font-size:16px;cursor:pointer;padding:0 2px";
        close.onclick = () => bar.remove();
        bar.append(close);
        document.body.append(bar);
      }
      if (params.has("card")) {
        // ?card: the dashboard card next to its visual editor (like Home Assistant's card dialog)
        document.querySelector("nextfloor-panel").remove();
        const CardClass = customElements.get("nextfloor-card");
        const wrap = document.createElement("div");
        wrap.style.cssText = "display:grid;grid-template-columns:420px 1fr;gap:24px;padding:24px;font-family:Figtree,Roboto,sans-serif;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--card-background-color:#1c1c1c;--primary-color:#03a9f4;--divider-color:rgba(225,225,225,.2)";
        const editorBox = document.createElement("div");
        editorBox.style.cssText = "background:#1c1c1c;border-radius:12px;padding:20px";
        const editor = await CardClass.getConfigElement();
        const card = document.createElement("nextfloor-card");
        let config = {
          type: "custom:nextfloor-card",
          quality: "low",
          floor: params.get("floor") || "eg",
          flows: false,
          controls: ["walls", "temperature"],
          fullscreen_button: true,
          floor_thumbs: true,
          ...(params.get("stack") ? { floor_stack: params.get("stack") } : {}),
          ...(params.has("nopanel") ? { room_panel: false } : {}),
          ...(params.has("night") ? { night: "00:00-23:59" } : {}),
          ...(params.has("kiosk") ? { idle_return: 1, idle_orbit: true } : {}),
        };
        card.setConfig(config);
        editor.setConfig(config);
        editor.addEventListener("config-changed", (e) => {
          config = e.detail.config;
          card.setConfig(config);
          editor.setConfig(config);
        });
        editor.hass = hass;
        card.hass = hass;
        editorBox.append(editor);
        wrap.append(editorBox, card);
        document.body.append(wrap);
        window.nfCard = card;
      } else {
        const panel = document.querySelector("nextfloor-panel");
        panel.hass = hass;
        window.addEventListener("hass-more-info", (e) => console.log("more-info", e.detail.entityId));
        panel.narrow = window.innerWidth < 870;
        window.nfPanel = panel;
      }
    </script>
  </body>
</html>
