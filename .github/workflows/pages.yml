name: Online demo

# Publishes the preview (invented demo data, mock Home Assistant) as the online demo on GitHub Pages:
# the released version (branch main) at the root and the version under development (branch dev) under /dev/.
# Only the preview page, its demo data and the built bundles go online, nothing from private/.
# Every run builds both branches from their latest state, so a push to either one refreshes the whole site.
on:
  push:
    branches: [main, dev]
    paths:
      - "site/**"
      - "preview/**"
      - "tools/make_showcase_types.mjs"
      - "custom_components/nextfloor/frontend/**"
      - "custom_components/nextfloor/packs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: src-main
      - uses: actions/checkout@v7
        with:
          ref: dev
          path: src-dev
      - name: Assemble the site
        run: |
          assemble() {
            src="$1"; out="$2"
            mkdir -p "$out/preview" "$out/custom_components/nextfloor"
            cp "$src/site/index.html" "$out/"
            cp "$src"/preview/*.html "$src"/preview/*.js "$out/preview/"
            cp -r "$src/custom_components/nextfloor/frontend" "$out/custom_components/nextfloor/"
            cp -r "$src/custom_components/nextfloor/packs" "$out/custom_components/nextfloor/"
            # the furniture builder (a page of its own; older branches do not have it yet)
            if [ -d "$src/site/builder" ]; then cp -r "$src/site/builder" "$out/"; fi
          }
          assemble src-main _site
          # the setup video lives at the release (too big for the repository); the page plays it in the browser
          mkdir -p _site/tutorial
          cp src-main/site/tutorial/* _site/tutorial/
          curl -fsSL -o _site/tutorial/nextfloor-tutorial.en.mp4 "https://github.com/therealMRBK/NextFloor/releases/download/v0.8.1/nextfloor-tutorial.en.mp4" || echo "::warning::tutorial video not found at the v0.8.1 release (point this at the newest release that carries it)"
          assemble src-dev _site/dev
          # the development demo says so, so nobody takes it for the release
          for page in _site/dev/index.html _site/dev/preview/index.html $( [ -f _site/dev/builder/index.html ] && echo _site/dev/builder/index.html ); do
            sed -i 's|<body>|<body><div style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99;padding:2px 14px;border-radius:0 0 10px 10px;background:#ffb547;color:#1a1200;font:700 12px sans-serif">DEV – work in progress</div>|' "$page"
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
